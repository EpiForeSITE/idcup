name: Render reports
run-name: Render reports (trigger=${{ github.event_name }}, max_pop=${{ github.event.inputs.max_pop || '50000' }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_pop:
        description: 'Maximum population to include in the simulation (default: 50 thousand)'
        required: false
        default: '50000'

permissions:
  contents: write

env:
  DEFAULT_MAX_POP: 50000

jobs:
  build-container:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image variables
        id: vars
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${REPO}:sha-${SHA}"
          LATEST="ghcr.io/${REPO}:latest"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          # Only tag/cache :latest on pushes to main
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "${IMAGE}" >> $GITHUB_OUTPUT
            echo "${LATEST}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "cache_to=type=inline" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMAGE}" >> $GITHUB_OUTPUT
            echo "cache_to=" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Containerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.latest }}
          cache-to: ${{ steps.vars.outputs.cache_to }}

  render:
    needs: build-container
    if: ${{ always() && (github.event_name == 'pull_request' || needs.build-container.result == 'success') }}
    permissions:
      packages: read
    strategy:
      matrix:
        city: ["Los Angeles", "San Francisco", "New York City", "Boston", "Houston", "Dallas", "Philadelphia", "Atlanta", "Seattle", "Miami", "Kansas City"]
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event_name == 'pull_request' && 'ghcr.io/epiforesite/idcup:latest' || needs.build-container.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Check cache
        id: cache
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-reports-${{ matrix.city }}-maxpop-${{ github.event.inputs.max_pop || env.DEFAULT_MAX_POP }}-${{ hashFiles( 'scenarios/template.qmd' ) }}
          path: scenarios/${{ matrix.city }}*

      - name: Render reports
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CITY="${{ matrix.city }}" MAX_POP="${{ github.event.inputs.max_pop || env.DEFAULT_MAX_POP }}" make scenario -B

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.city }}
          path: scenarios/${{ matrix.city }}*
          retention-days: 1 # We don't need them for long
  
  combine:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Configure git safe directory
        if: github.event_name == 'workflow_dispatch'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          path: scenarios/
          pattern: reports-*
          merge-multiple: true

      - name: Upload as a single file
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: all-reports
          path: scenarios/*

      - name: Commit scenario files to repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/
          if [ -z "$(git status --porcelain -- scenarios/)" ]; then
            echo "No changes detected in scenarios/"
            exit 0
          fi
          git commit -m "Update scenario reports [skip ci]"
          git push
