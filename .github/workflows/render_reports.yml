name: Render reports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=ghcr.io/${REPO}:sha-${SHA}" >> $GITHUB_OUTPUT
          echo "latest=ghcr.io/${REPO}:latest" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Containerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.latest }}
          cache-to: type=inline

  render:
    needs: build-container
    strategy:
      matrix:
        city: ["Los Angeles", "San Francisco", "New York City", "Boston", "Houston", "Dallas", "Philadelphia", "Atlanta", "Seattle", "Miami", "Kansas City"]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-container.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render reports
        run: |
          CITY="${{ matrix.city }}" make scenario -B

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.city }}
          path: scenarios/${{ matrix.city }}*
  
  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          path: scenarios/
          pattern: reports-*
          merge-multiple: true

      - name: Upload as a single file
        uses: actions/upload-artifact@v7
        with:
          name: all-reports
          path: scenarios/*
